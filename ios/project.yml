# XcodeGen spec. Regenerate with `cd ios && xcodegen generate`; never edit the .xcodeproj by hand.
name: RecipeBasket

options:
  bundleIdPrefix: com.leonparsons
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES     # no Info.plist files; usage strings are INFOPLIST_KEY_* settings
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"

packages:
  RecipeCore:
    path: Packages/RecipeCore

# Visible in the navigator, not compiled.
fileGroups:
  - ../docs
  - ../fixtures

targets:
  RecipeBasket:
    type: application
    platform: iOS            # XcodeGen's iOS preset sets TARGETED_DEVICE_FAMILY "1,2" (iPhone + iPad)
    sources:
      - RecipeBasket
    dependencies:
      - package: RecipeCore
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        INFOPLIST_KEY_CFBundleDisplayName: Recipe Basket
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  RecipeBasketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RecipeBasketTests
    dependencies:
      - target: RecipeBasket   # XcodeGen sets TEST_HOST / BUNDLE_LOADER
      - package: RecipeCore

schemes:
  RecipeBasket:
    build:
      targets:
        RecipeBasket: all
        RecipeBasketTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecipeBasketTests
        - package: RecipeCore/RecipeCoreTests   # `xcodebuild test` also runs the core suite on the simulator
