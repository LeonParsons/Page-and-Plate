# XcodeGen spec. Regenerate with `cd ios && xcodegen generate`; never edit the .xcodeproj by hand.
name: RecipeBasket

options:
  bundleIdPrefix: com.leonparsons
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  defaultConfig: Debug
  # Local secrets for the app (Worker URL, app key). Never fails a fresh clone.
  preGenCommand: '[ -f Config/Secrets.xcconfig ] || cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig'

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES     # no Info.plist files; usage strings are INFOPLIST_KEY_* settings
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(RB_TEAM_ID)
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"

packages:
  RecipeCore:
    path: Packages/RecipeCore

# Visible in the navigator, not compiled.
fileGroups:
  - ../docs
  - ../fixtures

targets:
  RecipeBasket:
    type: application
    platform: iOS            # XcodeGen's iOS preset sets TARGETED_DEVICE_FAMILY "1,2" (iPhone + iPad)
    sources:
      - RecipeBasket
    dependencies:
      - package: RecipeCore
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    # A real Info.plist (generated here, git-ignored) because RBAPIBaseURL / RBAppKey are custom keys.
    info:
      path: RecipeBasket/Info.plist
      properties:
        CFBundleDisplayName: Page & Plate
        RBAPIBaseURL: $(RB_API_BASE_URL)
        RBAppKey: $(RB_APP_KEY)
        NSCameraUsageDescription: Page & Plate uses the camera to photograph cookbook pages.
        NSRemindersFullAccessUsageDescription: Page & Plate adds a recipe's ingredients to a Reminders list you choose. It never reads, changes or deletes your existing reminders.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true      # plain-http localhost for `wrangler dev`
        UILaunchScreen:
          UIColorName: LaunchBackground   # the splash's own ground, so a cold launch doesn't flash white
        UIBackgroundModes:
          - remote-notification           # CloudKit pushes changes from the user's other devices
        CKSharingSupported: true          # without this, a share link opens the App Store instead of the app
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    # iCloud mirroring (Phase 9). Generated like Info.plist, so it is git-ignored.
    entitlements:
      path: RecipeBasket/RecipeBasket.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.leonparsons.RecipeBasket
        # Xcode rewrites this to `production` when archiving for distribution.
        aps-environment: development
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
        # Without this the AccentColor colour set is ignored and every tint falls back to system blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  RecipeBasketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RecipeBasketTests
      - path: RecipeBasket.storekit      # SKTestSession(configurationFileNamed:) reads it from the test bundle
        buildPhase: resources
    dependencies:
      - target: RecipeBasket   # XcodeGen sets TEST_HOST / BUNDLE_LOADER
      - package: RecipeCore
    settings:
      base:
        # Xcode 26's StoreKitTest headers use a StoreKit 1 type deprecated in iOS 18; the warning is Apple's, not ours.
        OTHER_SWIFT_FLAGS: -Xcc -Wno-deprecated-declarations

schemes:
  RecipeBasket:
    build:
      targets:
        RecipeBasket: all
        RecipeBasketTests: [test]
    run:
      config: Debug
      storeKitConfiguration: RecipeBasket.storekit   # local products for the simulator; App Store Connect later
    test:
      config: Debug
      targets:
        - RecipeBasketTests
        - package: RecipeCore/RecipeCoreTests   # `xcodebuild test` also runs the core suite on the simulator
